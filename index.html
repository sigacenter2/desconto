<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Desconto Pró</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            margin: 0;
            padding: 20px;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #f43f5e;
            text-align: center;
            font-weight: 600;
        }
        .campo {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #94a3b8;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background-color: #0f172a;
            border: 2px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #f43f5e;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #f43f5e;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #fb7185;
        }
        button:active {
            transform: scale(0.98);
        }
        .resultado {
            margin-top: 25px;
            padding: 15px;
            background-color: #1e1b4b;
            border: 1px solid #312e81;
            border-radius: 8px;
            display: none;
            line-height: 1.6;
        }
        .resultado.erro {
            background-color: #451a03;
            border: 1px solid #78350f;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Calcular Desconto</h2>
    
    <div class="campo">
        <label for="valorProduto">Valor Original do Produto:</label>
        <input type="text" id="valorProduto" placeholder="R\$ 0,00">
    </div>
    
    <div class="campo">
        <label for="porcentagem">Porcentagem de Desconto (%):</label>
        <input type="text" id="porcentagem" placeholder="0,00 %">
    </div>
    
    <button id="btnCalcular" onclick="calcularDesconto()">Calcular Preço com Desconto (Enter)</button>
    
    <div id="resultado" class="resultado"></div>
</div>

<script>
// Elementos da página
const inputValor = document.getElementById('valorProduto');
const inputPorcentagem = document.getElementById('porcentagem');

// Formatação automática para Moeda Real (R\$)
inputValor.addEventListener('input', function(e) {
    let valor = e.target.value.replace(/\D/g, '');
    if (valor === '') {
        e.target.value = '';
        return;
    }
    valor = (parseFloat(valor) / 100).toFixed(2);
    e.target.value = formatarMoeda(parseFloat(valor));
});

// Formatação automática para Porcentagem
inputPorcentagem.addEventListener('input', function(e) {
    let valor = e.target.value.replace(/\D/g, '');
    if (valor === '') {
        e.target.value = '';
        return;
    }
    valor = (parseFloat(valor) / 100).toFixed(2);
    e.target.value = valor.replace('.', ',') + ' %';
});

// Captura a tecla Enter nos campos de entrada
[inputValor, inputPorcentagem].forEach(input => {
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            calcularDesconto();
        }
    });
});

function formatarMoeda(numero) {
    return numero.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function converterParaNumero(texto) {
    if (!texto) return 0;
    let limpo = texto.replace(/[^\d,]/g, '').replace(',', '.');
    return parseFloat(limpo) || 0;
}

function calcularDesconto() {
    const valorOriginal = converterParaNumero(inputValor.value);
    const porcentagem = converterParaNumero(inputPorcentagem.value);
    const divResultado = document.getElementById('resultado');

    // Validação rápida
    if (valorOriginal <= 0) {
        divResultado.style.display = 'block';
        divResultado.classList.add('erro');
        divResultado.innerHTML = '<strong style="color: #fca5a5;">Aviso:</strong> Insira um valor de produto válido para calcular.';
        return;
    }

    divResultado.classList.remove('erro');

    // Cálculos modificados para Desconto
    const valorEconomizado = valorOriginal * (porcentagem / 100);
    const precoFinal = valorOriginal - valorEconomizado;

    // Exibição dos resultados
    divResultado.style.display = 'block';
    divResultado.innerHTML = `
        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
            <span style="color: #94a3b8;">Valor do Desconto:</span>
            <span style="color: #f43f5e; font-weight: 600;">- ${formatarMoeda(valorEconomizado)}</span>
        </div>
        <div style="display: flex; justify-content: space-between; border-top: 1px solid #312e81; padding-top: 8px; font-size: 18px;">
            <span style="color: #f8fafc; font-weight: 600;">Preço Final:</span>
            <span style="color: #38bdf8; font-weight: 700;">${formatarMoeda(precoFinal)}</span>
        </div>
    `;
}
</script>

</body>
</html>
